name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 1. Build e testes
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

  # 2. Verificação de segurança — se falhar, não publica
  security:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read          # CodeQL lê dados da execução
      pull-requests: read    # Gitleaks lista os commits do PR
      security-events: write # CodeQL publica alertas na aba Security
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Gitleaks varre todo o histórico

      - name: Gitleaks (senhas no código)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: npm audit (dependências)
        run: |
          for app in web admin; do
            echo "::group::npm audit $app"
            (cd "$app" && npm ci && npm audit --audit-level=high)
            echo "::endgroup::"
          done

      - name: CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # Repo privado sem Advanced Security não aceita upload para a aba Security:
      # a análise roda igual e o resultado é verificado no passo seguinte.
      - name: CodeQL análise
        uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results

      - name: CodeQL — falha se encontrou vulnerabilidades
        run: |
          TOTAL=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          echo "Alertas do CodeQL: $TOTAL"
          jq -r '.runs[].results[] | "- \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' codeql-results/*.sarif
          [ "$TOTAL" -eq 0 ]

  # 2b. Infraestrutura como código: formato, validação e SAST do Terraform
  iac:
    needs: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Checkov (SAST de infraestrutura, informativo)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true # algumas regras pedem recursos que o AWS Academy não oferece (KMS próprio, Multi-AZ...)

  # 3. Aprovação manual (environment production) + 4. Deploy nas EC2
  deploy:
    needs: [security, iac]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # pausa aqui até o revisor aprovar
    concurrency: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      PROJECT: ${{ vars.PROJECT || 'votacao' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # só no AWS Academy; em conta própria fica vazio
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command (admin primeiro, pois aplica as migrações)
        env:
          SHA: ${{ github.sha }}
        run: |
          deploy() { # $1 = web|admin
            # As EC2 são encontradas pela tag criada no Terraform (sobrevive à recriação no DR)
            ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Project,Values=$PROJECT" "Name=tag:Role,Values=$1" "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' --output text)
            [ -n "$ID" ] || { echo "Nenhuma EC2 $1 em execução"; exit 1; }

            echo "Publicando $1 ($SHA) na instância $ID"
            CMD_ID=$(aws ssm send-command \
              --instance-ids "$ID" \
              --document-name AWS-RunShellScript \
              --comment "deploy $1 ${SHA:0:7}" \
              --timeout-seconds 600 \
              --parameters commands="[\"set -e\",\"cd /opt/votacao\",\"git fetch --depth 50 origin $SHA\",\"git checkout -f $SHA\",\"bash deploy/atualizar.sh $1\"]" \
              --query Command.CommandId --output text)

            STATUS=Pending
            for _ in $(seq 1 120); do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)
              case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
            done
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query '{Status:Status,Saida:StandardOutputContent,Erro:StandardErrorContent}'
            [ "$STATUS" = "Success" ]
          }

          deploy admin
          deploy web
